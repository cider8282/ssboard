<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신조어 퀴즈</title>
  <style>
    :root {
      --bg: #f8f3e8;
      --line: #e9dfc7;
      --card: #fffaf7;
      --pink: #ffd8e3;
      --pink-strong: #ff95b3;
      --mint: #d8f3e8;
      --yellow: #ffe9a9;
      --blue: #d9ebff;
      --text: #2d2a26;
      --sub: #746a63;
      --green: #27ae60;
      --red: #e74c3c;
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Arial", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        repeating-linear-gradient(
          to bottom,
          var(--bg) 0px,
          var(--bg) 50px,
          var(--line) 50px,
          var(--line) 52px
        );
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1.02fr 1fr;
      gap: 28px;
      align-items: center;
    }

    .phone {
      background: var(--card);
      border: 10px solid #f7c6d5;
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 18px 18px 24px;
      max-width: 430px;
      margin: 0 auto;
    }

    .phone-inner {
      background: #fff;
      border-radius: 24px;
      padding: 18px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
    }

    .title {
      text-align: center;
      margin-bottom: 16px;
    }
    .title h1 {
      margin: 4px 0 8px;
      font-size: clamp(28px, 4vw, 42px);
      color: #ff7a8f;
      line-height: 1.1;
    }
    .title p {
      margin: 0;
      color: var(--sub);
      font-size: 15px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .pill {
      flex: 1;
      background: #fff3f6;
      border: 1.5px solid #f3d5dd;
      border-radius: 14px;
      padding: 10px 12px;
      color: #b05574;
      font-weight: 700;
      text-align: center;
      font-size: 14px;
    }

    .card {
      background: linear-gradient(135deg, #ffc4d0, #ffe89a);
      border-radius: 18px;
      padding: 26px 18px;
      text-align: center;
      margin-bottom: 16px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card .qno {
      color: #7d6a5b;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .card .word {
      font-size: clamp(34px, 6vw, 48px);
      font-weight: 900;
      margin-bottom: 14px;
    }
    .card .hint {
      color: #6c5d53;
      font-size: 15px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .choice {
      border: none;
      border-radius: 14px;
      background: #f8eeee;
      padding: 15px 10px;
      font-size: 16px;
      font-weight: 700;
      color: #564b46;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }
    .choice:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #fce5eb;
    }
    .choice:disabled { cursor: default; opacity: 0.98; }
    .choice.correct { background: #dff6e8; border: 2px solid #58be84; }
    .choice.wrong { background: #ffe2df; border: 2px solid #e97d72; }

    .feedback {
      min-height: 106px;
      background: #fafafa;
      border: 1.5px dashed #ddd2c7;
      border-radius: 14px;
      padding: 14px;
      line-height: 1.6;
      color: #4f4540;
      font-size: 15px;
      margin-bottom: 14px;
    }
    .feedback strong { font-size: 17px; }
    .feedback .ok { color: var(--green); }
    .feedback .no { color: var(--red); }
    .feedback .example {
      margin-top: 8px;
      color: #6e645d;
      font-size: 14px;
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.55; cursor: default; transform: none; }
    .btn-primary { background: #ff7b97; color: #fff; }
    .btn-secondary { background: #edf4ff; color: #406a9b; }

    .side {
      padding: 8px 6px;
    }
    .qr-box {
      display: flex;
      gap: 22px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .qr-placeholder {
      width: 210px;
      height: 210px;
      border: 8px solid #2cc15f;
      background:
        linear-gradient(90deg, #000 10px, transparent 10px) 0 0/30px 30px,
        linear-gradient(#000 10px, transparent 10px) 0 0/30px 30px,
        #fff;
      position: relative;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }
    .qr-placeholder::before,
    .qr-placeholder::after {
      content: "";
      position: absolute;
      width: 54px;
      height: 54px;
      border: 10px solid #000;
      background: #fff;
    }
    .qr-placeholder::before { top: 10px; left: 10px; }
    .qr-placeholder::after { top: 10px; right: 10px; }
    .qr-center {
      position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 46px; height: 46px; background: #000;
    }
    .qr-third {
      position: absolute;
      left: 10px; bottom: 10px;
      width: 54px; height: 54px; border: 10px solid #000; background: #fff;
    }

    .guide-text h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.2;
    }
    .guide-text p {
      margin: 0 0 8px;
      font-size: 17px;
      color: var(--sub);
      line-height: 1.7;
    }

    .animals {
      display: flex;
      gap: 18px;
      align-items: flex-end;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .animal {
      flex: 1;
      min-width: 120px;
      text-align: center;
      background: transparent;
    }
    .animal .face {
      font-size: 72px;
      display: block;
      line-height: 1;
      margin-bottom: 8px;
    }
    .animal .book {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 18px 18px 8px 8px;
      font-weight: 800;
      color: #2f2b29;
      box-shadow: var(--shadow);
    }
    .book.yellow { background: #ffe16b; }
    .book.green { background: #b8f0ae; }
    .book.blue { background: #8dc9ff; }

    .result-card {
      text-align: center;
      padding: 10px 2px 0;
    }
    .badge {
      display: inline-block;
      background: #fff5c8;
      color: #8a6b00;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      min-height: 95px;
      margin-top: 12px;
      border-radius: 14px;
      border: 1.5px solid #dbcfc0;
      padding: 12px;
      font: inherit;
      resize: vertical;
      background: #fffdfa;
    }
    .small-note {
      color: #7b716b;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .side { order: -1; }
      .guide-text h2 { font-size: 36px; }
      .phone-inner { min-height: auto; }
    }
    @media (max-width: 480px) {
      .choices { grid-template-columns: 1fr; }
      .phone { padding: 12px; border-width: 8px; }
      .phone-inner { padding: 14px; }
      .status { flex-direction: column; }
      .qr-placeholder { width: 160px; height: 160px; }
      .animals { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app">
      <section class="phone">
        <div class="phone-inner" id="screen">
          <div class="title">
            <h1>신조어 퀴즈</h1>
            <p>요즘 아이들이 쓰는 신조어를 맞혀 보세요!</p>
          </div>

          <div class="status">
            <div class="pill" id="progressText">문제: 1/10</div>
            <div class="pill" id="scoreText">점수: 0점</div>
          </div>

          <div class="card">
            <div class="qno" id="qNo">Q1</div>
            <div class="word" id="word">갑분싸</div>
            <div class="hint" id="hint">갑자기 분위기가 00해졌다</div>
          </div>

          <div class="choices" id="choices"></div>
          <div class="feedback" id="feedback">정답을 눌러 보세요. ⭕</div>

          <div class="actions">
            <button class="btn btn-secondary" id="restartBtn">처음부터</button>
            <button class="btn btn-primary" id="nextBtn" disabled>다음 문제</button>
          </div>
        </div>
      </section>

      <aside class="side">
        <div class="qr-box">
          <div class="qr-placeholder" aria-hidden="true">
            <div class="qr-center"></div>
            <div class="qr-third"></div>
          </div>
          <div class="guide-text">
            <h2>신조어 퀴즈를 풀며<br>문제를 맞추고<br>소감을 남겨봅시다. ✨</h2>
            <p>• 20개 단어 중 10문제가 무작위로 출제돼요.</p>
            <p>• 문제를 풀면 뜻과 예문을 바로 확인할 수 있어요.</p>
            <p>• 마지막에는 결과와 소감을 적을 수 있어요.</p>
          </div>
        </div>

        <div class="animals">
          <div class="animal"><span class="face">🐻</span><span class="book yellow">읽는 중</span></div>
          <div class="animal"><span class="face">🐰</span><span class="book green">집중!</span></div>
          <div class="animal"><span class="face">🐱</span><span class="book blue">도전!</span></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const QUESTION_COUNT = 10;
    const bank = [
      { term: "갑분싸", hint: "갑자기 분위기가 00해졌다", answer: "갑자기 분위기가 싸해짐", options: ["갑자기 분위기가 싸해짐", "가볍게 분위기가 좋아짐", "이상하게 웃긴 상황", "조용히 쉬는 시간"], example: "내가 엉뚱한 말을 했더니 갑분싸가 됐어." },
      { term: "TMI", hint: "필요 이상으로 자세한 정보", answer: "필요 이상으로 자세한 정보", options: ["필요 이상으로 자세한 정보", "오늘의 중요한 정보", "친구끼리만 아는 말", "시험에 나오는 정보"], example: "TMI이지만 나는 떡볶이를 세 번이나 먹었어." },
      { term: "내돈내산", hint: "누가 산 걸까요?", answer: "내 돈으로 내가 산 것", options: ["내 돈으로 내가 산 것", "내 동생이 내가 산 것", "내가 돈을 내고 친구가 산 것", "엄마가 사 준 것"], example: "이 필통은 광고 아니고 내돈내산이야." },
      { term: "오운완", hint: "오늘 + 운동 + 완료", answer: "오늘 운동 완료", options: ["오늘 운동 완료", "오전에 운동 완료", "오늘 운이 완전 좋음", "운동을 오래 하면 완벽"], example: "학교 끝나고 줄넘기 100번! 오운완!" },
      { term: "많관부", hint: "줄임말이에요", answer: "많은 관심 부탁드립니다", options: ["많은 관심 부탁드립니다", "많이 관찰해 주세요", "많이 관리해 주세요", "많이 간식 부탁해요"], example: "우리 모둠 발표 많관부!" },
      { term: "무물", hint: "질문과 관계 있어요", answer: "무엇이든 물어보세요", options: ["무엇이든 물어보세요", "무서운 물건", "물 마시는 시간", "무언가를 물리침"], example: "오늘 쉬는 시간에 무물 받을게!" },
      { term: "찐텐", hint: "가짜가 아니에요", answer: "진짜로 신난 상태", options: ["진짜로 신난 상태", "조용히 있는 상태", "실수해서 긴장한 상태", "화가 많이 난 상태"], example: "체육 시간에 우리 팀이 이겨서 다들 찐텐이었어." },
      { term: "억텐", hint: "억지 + 텐션", answer: "억지로 신난 척함", options: ["억지로 신난 척함", "매우 크게 화냄", "정말 신나서 소리침", "긴장해서 말을 못함"], example: "조금 피곤했지만 친구 앞에서는 억텐으로 웃었어." },
      { term: "현타", hint: "현실을 느끼는 순간", answer: "갑자기 현실을 깨닫고 허무해짐", options: ["갑자기 현실을 깨닫고 허무해짐", "현재 시간이 타이트함", "현명한 타이밍", "활동이 재미있어짐"], example: "숙제를 미루다가 밤이 되니 현타가 왔어." },
      { term: "갓생", hint: "정말 멋지게 사는 모습", answer: "부지런하고 계획적으로 사는 생활", options: ["부지런하고 계획적으로 사는 생활", "게임을 아주 잘하는 생활", "친구와 많이 노는 생활", "하루 종일 쉬는 생활"], example: "일찍 자고 책 읽고 운동하는 갓생을 살고 싶어." },
      { term: "중꺾마", hint: "긴 문장의 줄임말", answer: "중요한 것은 꺾이지 않는 마음", options: ["중요한 것은 꺾이지 않는 마음", "중간에 꺾으면 마음이 편함", "중요한 꺾은선그래프", "중심을 꺾지 말자"], example: "시험이 어려워도 중꺾마로 끝까지 해 보자!" },
      { term: "알잘딱깔센", hint: "알아서 + 잘 + 딱 + 깔끔 + 센스", answer: "알아서 잘 딱 깔끔하고 센스 있게", options: ["알아서 잘 딱 깔끔하고 센스 있게", "알림장을 잘 꾸미는 선생님", "알맞고 잘 달리는 센터", "알아서 공부를 많이 하자"], example: "준비물은 알잘딱깔센하게 챙겨 와." },
      { term: "스불재", hint: "누가 불렀을까요?", answer: "스스로 불러온 재앙", options: ["스스로 불러온 재앙", "스스로 불편한 재미", "스트레스를 불태우는 재주", "스무디 불고기 재료"], example: "숙제를 안 해 놓고 놀아서 스불재가 됐어." },
      { term: "별다줄", hint: "줄임말을 말하는 줄임말", answer: "별걸 다 줄인다", options: ["별걸 다 줄인다", "별로 다정하지 않다", "별을 다르게 줄 세운다", "별이 다 사라진다"], example: "이 단어도 줄였다고? 정말 별다줄이네!" },
      { term: "킹받네", hint: "재미있게 짜증 날 때", answer: "아주 약 오르거나 짜증 난다", options: ["아주 약 오르거나 짜증 난다", "왕처럼 멋지다", "기분이 평화롭다", "웃겨서 참을 수 없다"], example: "친구가 바로 앞에서 과자를 혼자 먹으니 좀 킹받네." },
      { term: "폼 미쳤다", hint: "실력·상태를 말해요", answer: "실력이나 상태가 매우 좋다", options: ["실력이나 상태가 매우 좋다", "정신없이 바쁘다", "옷차림이 이상하다", "화가 많이 났다"], example: "오늘 우리 반 축구팀 폼 미쳤다!" },
      { term: "느좋", hint: "느낌이…?", answer: "느낌이 좋다", options: ["느낌이 좋다", "늦게 와서 좋다", "늘 조용하다", "느리지만 정확하다"], example: "새로 꾸민 교실 분위기가 느좋이다." },
      { term: "추구미", hint: "내가 추구하는 모습", answer: "내가 닮고 싶거나 추구하는 분위기", options: ["내가 닮고 싶거나 추구하는 분위기", "친구와 다투는 마음", "숙제를 줄이고 싶은 마음", "중요한 비밀 메모"], example: "내 추구미는 차분하고 친절한 사람이야." },

      { term: "럭키비키", hint: "좋은 쪽으로 생각해요", answer: "어려운 상황도 긍정적으로 받아들이는 태도", options: ["어려운 상황도 긍정적으로 받아들이는 태도", "행운을 빌어 주는 인사", "운동 경기에서 이기는 비법", "정답을 빨리 맞히는 방법"], example: "비가 와서 소풍이 취소됐지만 실내 놀이를 해서 럭키비키야!" }
    ];

    let quiz = [];
    let current = 0;
    let score = 0;
    let answered = false;

    let progressText = document.getElementById('progressText');
    let scoreText = document.getElementById('scoreText');
    let qNo = document.getElementById('qNo');
    let word = document.getElementById('word');
    let hint = document.getElementById('hint');
    let choicesBox = document.getElementById('choices');
    let feedback = document.getElementById('feedback');
    let nextBtn = document.getElementById('nextBtn');
    let restartBtn = document.getElementById('restartBtn');
    const screen = document.getElementById('screen');

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getLevelText(score) {
      if (score >= 9) return { label: '신조어 박사 🎓', text: '정말 대단해요! 요즘 말에 아주 강하군요.' };
      if (score >= 7) return { label: '신조어 탐험가 🔎', text: '아주 잘했어요! 새 말에 대한 감각이 좋아요.' };
      if (score >= 5) return { label: '신조어 연습생 🌱', text: '좋아요! 몇 개만 더 익히면 금방 실력이 늘어요.' };
      return { label: '신조어 새싹 🌼', text: '괜찮아요! 다시 도전하면 훨씬 더 잘할 수 있어요.' };
    }

    function startQuiz() {
      quiz = shuffle(bank).slice(0, QUESTION_COUNT).map(q => ({ ...q, shuffledOptions: shuffle(q.options) }));
      current = 0;
      score = 0;
      answered = false;
      renderQuestion();
    }

    function renderQuestion() {
      const q = quiz[current];
      answered = false;
      progressText.textContent = `문제: ${current + 1}/${quiz.length}`;
      scoreText.textContent = `점수: ${score}점`;
      qNo.textContent = `Q${current + 1}`;
      word.textContent = q.term;
      hint.textContent = q.hint;
      feedback.innerHTML = '정답을 눌러 보세요. ⭕';
      nextBtn.disabled = true;

      choicesBox.innerHTML = '';
      q.shuffledOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = option;
        btn.addEventListener('click', () => selectAnswer(btn, option));
        choicesBox.appendChild(btn);
      });
    }

    function selectAnswer(button, selected) {
      if (answered) return;
      answered = true;
      const q = quiz[current];
      const buttons = [...document.querySelectorAll('.choice')];

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.answer) btn.classList.add('correct');
      });

      if (selected === q.answer) {
        score += 1;
        button.classList.add('correct');
        feedback.innerHTML = `<strong class="ok">⭕ 정답!</strong><br><b>${q.term}</b>은(는) <b>"${q.answer}"</b>이라는 뜻이에요.<div class="example">예문: ${q.example}</div>`;
      } else {
        button.classList.add('wrong');
        feedback.innerHTML = `<strong class="no">❌ 아쉬워요!</strong><br><b>${q.term}</b>의 뜻은 <b>"${q.answer}"</b>이에요.<div class="example">예문: ${q.example}</div>`;
      }

      scoreText.textContent = `점수: ${score}점`;
      nextBtn.disabled = false;
      nextBtn.textContent = current === quiz.length - 1 ? '결과 보기' : '다음 문제';
    }

    function showResult() {
      const level = getLevelText(score);
      progressText.textContent = `완료: ${quiz.length}/${quiz.length}`;
      scoreText.textContent = `최종 점수: ${score}점`;

      screen.innerHTML = `
        <div class="title">
          <h1>퀴즈 완료!</h1>
          <p>신조어 퀴즈를 모두 풀었어요.</p>
        </div>
        <div class="result-card">
          <div class="badge">${level.label}</div>
          <div class="card" style="min-height:auto; padding:28px 18px;">
            <div class="qno">최종 결과</div>
            <div class="word">${score} / ${quiz.length}</div>
            <div class="hint">${level.text}</div>
          </div>
          <div class="feedback" style="text-align:left; min-height:auto;">
            <strong>오늘 새롭게 알게 된 신조어 또는 소감을 적어 보세요.</strong>
            <textarea id="reflection" placeholder="예) ‘알잘딱깔센’의 뜻을 처음 알았어요. 친구들과 재미있게 풀었어요!"></textarea>
            <div class="small-note">원하면 이 내용을 복사해서 학습 활동지에 옮겨 적을 수 있어요.</div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" id="copyBtn">소감 복사</button>
            <button class="btn btn-primary" id="restartBtn2">다시 하기</button>
          </div>
        </div>
      `;

      document.getElementById('restartBtn2').addEventListener('click', rebuildQuizUI);
      document.getElementById('copyBtn').addEventListener('click', async () => {
        const text = document.getElementById('reflection').value.trim();
        if (!text) {
          alert('먼저 소감을 적어 주세요.');
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          alert('소감을 복사했어요!');
        } catch {
          alert('복사 기능을 사용할 수 없어요. 직접 선택해서 복사해 주세요.');
        }
      });
    }

    function rebuildQuizUI() {
      screen.innerHTML = `
        <div class="title">
          <h1>신조어 퀴즈</h1>
          <p>요즘 아이들이 쓰는 신조어를 맞혀 보세요!</p>
        </div>
        <div class="status">
          <div class="pill" id="progressText">문제: 1/10</div>
          <div class="pill" id="scoreText">점수: 0점</div>
        </div>
        <div class="card">
          <div class="qno" id="qNo">Q1</div>
          <div class="word" id="word">갑분싸</div>
          <div class="hint" id="hint">갑자기 분위기가 00해졌다</div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback">정답을 눌러 보세요. ⭕</div>
        <div class="actions">
          <button class="btn btn-secondary" id="restartBtn">처음부터</button>
          <button class="btn btn-primary" id="nextBtn" disabled>다음 문제</button>
        </div>
      `;

      bindElements();
      startQuiz();
    }

    function bindElements() {
      progressText = document.getElementById('progressText');
      scoreText = document.getElementById('scoreText');
      qNo = document.getElementById('qNo');
      word = document.getElementById('word');
      hint = document.getElementById('hint');
      choicesBox = document.getElementById('choices');
      feedback = document.getElementById('feedback');
      nextBtn = document.getElementById('nextBtn');
      restartBtn = document.getElementById('restartBtn');
      nextBtn.addEventListener('click', () => {
        if (current < quiz.length - 1) {
          current += 1;
          renderQuestion();
        } else {
          showResult();
        }
      });
      restartBtn.addEventListener('click', startQuiz);
    }

    // Initial bind
    bindElements();
    startQuiz();
  </script>
</body>
</html>
